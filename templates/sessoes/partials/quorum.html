{% if quorum.atingido %}
<div class="flex items-center gap-3 p-3 bg-[#00703C]/10 border border-[#00703C]/30 rounded-lg">
    <div class="w-3 h-3 rounded-full bg-[#00703C]"></div>
    <div>
        <p class="text-xs font-bold text-[#00703C] uppercase tracking-wider">Quórum Atingido</p>
        <p class="text-sm text-[#0F172A] font-semibold">{{ quorum.presentes }} de {{ quorum.esperados }} delegados ({{ quorum.percentual }}%)</p>
    </div>
</div>
{% else %}
<div class="flex items-center gap-3 p-3 bg-[#FEF2F2] border border-[#DC2626]/30 rounded-lg">
    <div class="w-3 h-3 rounded-full bg-[#DC2626] {% if sessao.status == 2 %}animate-pulse{% endif %}"></div>
    <div>
        <p class="text-xs font-bold text-[#DC2626] uppercase tracking-wider">Sem Quórum</p>
        <p class="text-sm text-[#0F172A] font-semibold">{{ quorum.presentes }} de {{ quorum.esperados }} delegados ({{ quorum.percentual }}%)</p>
    </div>
</div>
{% endif %}
